[project]
name = "dbpersist-pubsub"
version = "0.1.0"
description = "Pub/sub service: subscriptions with a JSON filter DSL, Celery fan-out, webhook delivery"
requires-python = ">=3.12"
dependencies = [
    "dbpersist-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.35,<2.1",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "httpx>=0.27",
    "opentelemetry-instrumentation-celery>=0.48b0",
]

[tool.uv.sources]
dbpersist-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dbpersist_pubsub"]
