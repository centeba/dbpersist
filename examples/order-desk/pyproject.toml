[project]
name = "order-desk"
version = "0.1.0"
description = "Example application built on dbpersist: an order desk with live notifications"
requires-python = ">=3.12"
dependencies = [
    "dbpersist-sdk",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[tool.uv.sources]
dbpersist-sdk = { path = "../../packages/sdk", editable = true }
dbpersist-common = { path = "../../packages/common", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orderdesk"]
